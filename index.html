<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORBIT 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #19313A;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #19313A;
    }

    /* ========================================
       BACKGROUND LIGHT
       ======================================== */

    .background-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(5px);
    }

    .glow-left {
      width: 260px;
      height: 260px;
      left: -130px;
      top: 5%;

      background: rgba(49, 86, 106, 0.22);
    }

    .glow-right {
      width: 330px;
      height: 330px;
      right: -150px;
      bottom: -100px;

      background: rgba(181, 154, 85, 0.18);
    }

    .glow-top {
      width: 180px;
      height: 180px;
      right: 20%;
      top: -100px;

      background: rgba(59, 91, 105, 0.15);
    }


    /* ========================================
       FLOATING INFORMATION ICONS
       ======================================== */

    .floating-icon {
      position: absolute;

      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: rgba(255, 255, 255, 0.07);

      border: 1px solid rgba(255, 255, 255, 0.13);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font-size: 19px;

      animation: floating 4s ease-in-out infinite;

      opacity: 0.8;
    }

    .floating-one {
      top: 15%;
      left: 17%;
      animation-delay: 0s;
    }

    .floating-two {
      top: 19%;
      right: 18%;
      animation-delay: 1s;
    }

    .floating-three {
      bottom: 17%;
      left: 19%;
      animation-delay: 1.8s;
    }

    .floating-four {
      bottom: 14%;
      right: 18%;
      animation-delay: 2.6s;
    }

    @keyframes floating {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-9px) rotate(3deg);
      }

    }



    /* ========================================
       KNOWLEDGE ORBIT
       ======================================== */

    .knowledge-loader {
      position: relative;

      width: 170px;
      height: 170px;

      margin-bottom: 23px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit {
      position: absolute;

      width: 150px;
      height: 150px;

      border: 1.5px solid rgba(181, 154, 85, 0.28);

      border-radius: 50%;

      animation: rotateOrbit 8s linear infinite;
    }

    .orbit::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      top: -5px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background: #C6A85D;

      box-shadow:
        0 0 0 5px rgba(198, 168, 93, 0.10),
        0 0 18px rgba(198, 168, 93, 0.50);
    }


    .orbit-inner {
      position: absolute;

      width: 112px;
      height: 112px;

      border: 1.5px solid rgba(130, 170, 185, 0.30);

      border-radius: 50%;

      animation: rotateOrbitReverse 6s linear infinite;
    }

    .orbit-inner::after {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      right: -4px;
      top: 50%;

      transform: translateY(-50%);

      border-radius: 50%;

      background: #8FB4C3;

      box-shadow:
        0 0 0 5px rgba(143, 180, 195, 0.10),
        0 0 18px rgba(143, 180, 195, 0.40);
    }

    @keyframes rotateOrbit {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    @keyframes rotateOrbitReverse {

      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }

    }


    /* ========================================
       CENTRAL GLOBE
       ======================================== */

    .globe {

      position: relative;

      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #527D8B,
          #315C6B 48%,
          #24475A
        );

      border: 1px solid rgba(255, 255, 255, 0.16);

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.28),
        inset 5px 5px 12px rgba(255, 255, 255, 0.12),
        inset -5px -5px 12px rgba(0, 0, 0, 0.18);

      animation: globePulse 3s ease-in-out infinite;
    }

    .globe::before {
      content: "";

      position: absolute;

      width: 45px;
      height: 45px;

      border: 1.5px solid rgba(255, 255, 255, 0.52);

      border-radius: 50%;
    }

    .globe::after {
      content: "";

      position: absolute;

      width: 52px;
      height: 20px;

      border-top: 1.5px solid rgba(255, 255, 255, 0.48);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.48);

      border-radius: 50%;
    }

    .globe-symbol {
      position: relative;
      z-index: 2;

      color: rgba(255, 255, 255, 0.90);

      font-size: 27px;

      font-weight: 600;
    }

    @keyframes globePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

    }


    /* ========================================
       KNOWLEDGE ICONS
       ======================================== */

    .knowledge-icon {
      position: absolute;

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.09);

      border: 1px solid rgba(255, 255, 255, 0.14);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.16);

      font-size: 17px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      animation: iconFloat 3s ease-in-out infinite;
    }

    .icon-book {
      top: 0;
      left: 12px;
      animation-delay: 0.3s;
    }

    .icon-light {
      top: 14px;
      right: 2px;
      animation-delay: 0.8s;
    }

    .icon-document {
      bottom: 6px;
      right: 15px;
      animation-delay: 1.3s;
    }

    .icon-star {
      bottom: 5px;
      left: 13px;
      animation-delay: 1.8s;
    }

    .icon-chart {
      top: 50%;
      left: -2px;
      animation-delay: 2.2s;
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }


    /* ========================================
       BRAND
       ======================================== */

    .brand {

      font-size: 1.55rem;

      font-weight: 800;

      letter-spacing: 0.5px;

      color: #F4F5F6;

      margin-bottom: 5px;
    }

    .brand-subtitle {

      color: #B9C8CF;

      font-size: 0.84rem;

      font-weight: 500;

      letter-spacing: 0.7px;

      margin-bottom: 25px;
    }


    /* ========================================
       LOADING TEXT
       ======================================== */

    .loading-text {

      font-size: 0.92rem;

      font-weight: 600;

      color: #D5DEE2;

      letter-spacing: 0.2px;
    }

    .loading-text::after {

      content: '';

      animation: dots 2s infinite;
    }

    @keyframes dots {

      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }

    }


    /* ========================================
       PROGRESS BAR
       ======================================== */

    .progress-container {

      width: 190px;

      height: 4px;

      margin-top: 15px;

      overflow: hidden;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.10);
    }

    .progress-bar {

      width: 45%;

      height: 100%;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #7C9EAA,
          #B59A55,
          #D1B66A
        );

      animation:
        loadingProgress 1.6s ease-in-out infinite;
    }

    @keyframes loadingProgress {

      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(320%);
      }

    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 480px) {

      .loading-content {

        width: 88%;

        padding: 32px 22px 28px;

        border-radius: 27px;
      }

      .knowledge-loader {

        transform: scale(0.92);

        margin-bottom: 18px;
      }

      .brand {

        font-size: 1.35rem;
      }

      .brand-subtitle {

        font-size: 0.75rem;

        margin-bottom: 22px;
      }

      .loading-text {

        font-size: 0.85rem;
      }

      .floating-icon {

        width: 36px;
        height: 36px;

        font-size: 17px;
      }

    }

  </style>
</head>

    <!-- ========================================
         IFRAME APLIKASI
         TIDAK DIUBAH
         ======================================== -->

    <div class="iframe-container">

      <iframe
        id="appFrame"
        src=""
        allow="fullscreen; camera; microphone"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads">
      </iframe>

    </div>

  </div>


  <script>

    // =============================================
    // URL GOOGLE APPS SCRIPT
    // TIDAK DIUBAH
    // =============================================

    var APP_URL = "https://script.google.com/macros/s/AKfycbxv1yCZODIO2b2Pt8HzEwKmHUkk2S9hFelM7QP718pP8Folab0qJ-2qS2UgnDBYcsE8OQ/exec";

    var appFrame = document.getElementById('appFrame');

    var loading = document.getElementById('loading');


    // =============================================
    // HANDLER REQUEST DARI IFRAME
    // TIDAK DIUBAH
    // =============================================

    window.addEventListener('message', function(event) {

      try {

        var data = event.data;

        if (!data || typeof data !== 'object') return;


        // 1. Buka tab kosong

        if (data.action === 'openBlank') {

          window.open('', '_blank');

          return;
        }


        // 2. Buka URL langsung

        if (data.action === 'openDownload' && data.url) {

          window.open(data.url, '_blank');

          return;
        }


        // 3. Fullscreen

        if (data.action === 'requestFullscreen') {

          var el = document.documentElement;

          var fn =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.msRequestFullscreen;

          if (fn) fn.call(el).catch(function(){});

          return;
        }

      } catch(e) {

        console.warn('PostMessage error:', e);

      }

    });


    // =============================================
    // LOGIKA DELAY 6 DETIK
    // TIDAK DIUBAH
    // =============================================

    var startTime = Date.now();

    var MIN_LOAD_TIME = 6000;


    function loadApp() {

      var fullUrl = window.location.href;

      var params =
        new URLSearchParams(window.location.search);

      var id = params.get('id');

      var targetUrl = APP_URL;


      if (id) {

        if (targetUrl.indexOf('?') !== -1) {

          targetUrl += "&id=" + id;

        } else {

          targetUrl += "?id=" + id;

        }

      }


      appFrame.src = targetUrl;

    }


    function hideLoading() {

      loading.classList.add('hidden');

    }


    appFrame.addEventListener('load', function() {

      var elapsedTime =
        Date.now() - startTime;

      var remainingTime =
        MIN_LOAD_TIME - elapsedTime;


      if (remainingTime > 0) {

        setTimeout(
          hideLoading,
          remainingTime
        );

      } else {

        hideLoading();

      }

    });


    window.addEventListener(
      'DOMContentLoaded',
      loadApp
    );

  </script>

</body>
</html>
