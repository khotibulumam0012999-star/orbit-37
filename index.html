<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORBIT 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">
  <style>
    body {
      background: #19313A;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
  <script>
    // URL GOOGLE APPS SCRIPT
    var APP_URL = "https://script.google.com/macros/s/AKfycbxv1yCZODIO2b2Pt8HzEwKmHUkk2S9hFelM7QP718pP8Folab0qJ-2qS2UgnDBYcsE8OQ/exec";

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var targetUrl = APP_URL;

    if (id) {
      if (targetUrl.indexOf('?') !== -1) {
        targetUrl += "&id=" + id;
      } else {
        targetUrl += "?id=" + id;
      }
    }

    // Melakukan redirect langsung ke Google Apps Script
    window.location.replace(targetUrl);
  </script>
</head>
<body>

</body>
